name: Manual Release (Source Code Version Tag)

on:
  workflow_dispatch:

jobs:
  create_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Aftman
        uses: ok-nick/setup-aftman@v0.4.2
        with:
          cache: true

      - name: Build As RBXM
        run: rojo build default.project.json --output StringBuilder.rbxm
        
      - name: Extract Version from source
        id: get_version
        run: |
          VERSION=$(grep -E '@version' src/init.luau | sed -E 's/.*@version:?[[:space:]]*([0-9.]+).*/\1/' | tr -d '\r')
          echo "Found version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          SHA=$(git rev-parse HEAD)
          echo "COMMIT_SHA=$SHA" >> $GITHUB_ENV

      - name: Prepare source
        run: |
          cp src/init.luau ./StringBuilder.luau

      - name: Update Tag & Prepare Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f "${{ env.VERSION }}" "${{ env.COMMIT_SHA }}"
          git push origin "${{ env.VERSION }}" --force
          gh release edit "${{ env.VERSION }}" --target "${{ env.COMMIT_SHA }}" --notes "" || true
          
      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ env.COMMIT_SHA }}
          name: StringBuilder ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            StringBuilder.luau
            StringBuilder.rbxm
          draft: false
          prerelease: false